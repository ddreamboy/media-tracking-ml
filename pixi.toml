[workspace]
name = "media-tracking-ml"
version = "0.1.0"
description = "Media tracking ML research"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "win-64"]

[feature.base.dependencies]
python = "3.11.*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
joblib = "*"
tqdm = "*"
fastparquet = "*"
setuptools = "*"
sentence-transformers = "*"
umap-learn = "*"
hdbscan = "*"

[feature.base.pypi-dependencies]
pymorphy3 = "*"
pymorphy2-dicts-ru = "*"
razdel = "*"
huggingface-hub = "*"
bertopic = "*"
gensim = "*"
optuna = "*"

[feature.cuda.dependencies]
pytorch = { version = "*", channel = "pytorch" }
pytorch-cuda = { version = "12.*", channel = "pytorch" }

[feature.cpu.dependencies]
pytorch = { version = "*", channel = "pytorch" }
cpuonly = { version = "*", channel = "pytorch" }

[environments]
cuda = { features = ["base", "cuda"], solve-group = "cuda" }
cpu = { features = ["base", "cpu"], solve-group = "cpu" }

[feature.base.tasks]
lab = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser"
